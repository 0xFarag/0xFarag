name: Blue evidence browser acceptance
on:
  push:
    branches:
      - review/authzledger-blue-evidence-offline
    paths:
      - .github/workflows/blue-evidence-browser.yml
      - authzledger/blue_evidence.py
      - authzledger/commands_platform.py
      - authzledger/studio.py
      - authzledger/studio_platform.py
      - authzledger/web/app.js
      - authzledger/web/assessment.js
      - authzledger/web/index.html
      - authzledger/web/platform.js
      - examples/blue-evidence/**
      - tests/browser_blue_evidence.cjs
  pull_request:
    branches: [review/authzledger-blue-evidence-offline]
    paths:
      - .github/workflows/blue-evidence-browser.yml
      - authzledger/blue_evidence.py
      - authzledger/web/index.html
      - authzledger/web/platform.js
      - tests/browser_blue_evidence.cjs
      - tests/test_blue_evidence.py
permissions:
  contents: read
jobs:
  offline-browser:
    if: github.event_name != 'pull_request' || github.head_ref == 'review/blue-evidence-alert-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check saved evidence and CLI/Studio parity
        run: python -m unittest discover -s tests -p test_blue_evidence.py -v
      - name: Install the pinned browser runtime
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx --no-install playwright install --with-deps --only-shell chromium
      - name: Run offline comparison through Studio
        run: node tests/browser_blue_evidence.cjs
