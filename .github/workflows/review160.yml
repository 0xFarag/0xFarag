name: AuthzLedger 1.6 offline source review
on:
  push:
    branches:
      - review/authzledger-1.6-offline-federation

permissions:
  contents: read

jobs:
  offline:
    name: Offline import and evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install report renderer
        run: python -m pip install 'reportlab==4.4.9'
      - name: Check the exact review commit and run federation tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest -v \
            tests.test_federation_offline \
            tests.test_federation_entrypoints \
            tests.test_federation_retention \
            tests.test_federation_index \
            tests.test_federation_index_entrypoints
      - name: Check the projection contract, support matrix, and dossier verifier
        run: |
          python -m unittest discover -s review/1.6/demo_d -p test_verify.py -v
          python review/1.6/test_adapter_support.py --checkout .
          PYTHONPATH=. python review/1.6/vendor-proof/verify.py
          python -m unittest discover -s review/1.6 -p test_check_release_gate.py -v
      - name: Re-open and verify the three-source offline evidence package
        run: python review/1.6/reproduce_demo_d.py --checkout . --out "${RUNNER_TEMP}/authzledger-demo-d"
