name: Verify recovered Team source
on:
  push:
    branches: [integration/team-workbench-1.5.0.1]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r team/requirements.txt
      - run: python -m unittest discover -s qa -p 'test_team*.py' -v
      - run: python -m compileall -q team packaging/team scripts
      - run: node --test qa/rbac-policy.test.mjs qa/rbac-retest.test.mjs qa/rbac-matrix.test.mjs
