name: Verify and release AuthzLedger 1.5

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '1767225600'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      stable: ${{ steps.gate.outputs.stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned verification runtimes
        run: |
          python -m pip install 'setuptools==84.0.0' 'wheel==0.48.0' '.[reports]' 'pypdf==6.10.0'
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps --only-shell chromium
      - name: Full regression, eight browser suites, three demos and isolated distribution
        run: python tools/verify_release150.py --out artifacts/release150
      - name: Require complete same-commit receipts
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_gate150.py --receipt-dir artifacts/release150 --allow-development
          version=$(python -c 'from authzledger import __version__; print(__version__)')
          if [ "$version" = '1.5.0' ]; then
            python tools/release_gate150.py --receipt-dir artifacts/release150 --publication
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain verified assets and actual execution logs
        uses: actions/upload-artifact@v4
        with:
          name: authzledger-verified-${{ github.sha }}
          path: |
            dist/
            artifacts/release150/verification.json
            artifacts/release150/*.log
          if-no-files-found: error
          retention-days: 30
      - name: Retain failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authzledger-failure-${{ github.sha }}
          path: |
            artifacts/release150/verification.json
            artifacts/release150/unit-results.json
            artifacts/release150/*.log
            artifacts/browser*/
          if-no-files-found: warn
          retention-days: 14

  publish150:
    needs: [verify]
    if: github.repository == '0xFarag/0xFarag' && github.event_name == 'push' && github.ref == 'refs/heads/authzledger-v1.5.0' && needs.verify.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: authzledger-v1.5.0-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: authzledger-verified-${{ github.sha }}
          path: .
      - name: Recheck exact publication commit and retained assets
        run: |
          python tools/release_gate150.py --receipt-dir artifacts/release150 --publication
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable AuthzLedger 1.5.0 once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: 0xFarag/0xFarag
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/git/ref/heads/authzledger-v1.5.0" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'The release branch advanced; this older verified commit will not be published.'
            exit 1
          fi
          if gh release view v1.5.0 --repo "$GH_REPO" --json tagName >/dev/null 2>&1; then
            echo 'Existing release retained; no assets or tags overwritten.'
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.5.0' -f sha="$GITHUB_SHA"
          gh release create v1.5.0 dist/authzledger-1.5.0-source.zip dist/authzledger-1.5.0-py3-none-any.whl dist/authzledger-1.5.0-proof.zip dist/verify_bundle.py dist/verification.json dist/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --verify-tag \
            --title 'AuthzLedger 1.5.0 — From scope to proof' \
            --notes-file docs/release-1.5.0.md --latest
          gh release view v1.5.0 --repo "$GH_REPO" --json url,isDraft,isPrerelease,tagName,targetCommitish,assets
