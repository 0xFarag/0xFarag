name: Verify and release AuthzLedger

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_110:
        description: 'Publish 1.1.0 only after its complete contract and version gates pass'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '1767225600'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned assessment report renderer
        run: python -m pip install '.[reports]' 'pypdf==6.10.0'
      - name: Unit, adversarial and local HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Full authorization intelligence and independent proof workflow
        run: python tools/release_check.py --out artifacts/acceptance
      - name: Source-bound selective comparison and isolated proof verification
        run: python tools/check_comparison.py --out artifacts/comparison-acceptance
      - name: Import, controlled finding, reproducer, retest and independent proof
        run: python tools/check_assessment.py --out artifacts/assessment-acceptance
      - name: Isolated workflow, replay and mutating reduction
        run: python tools/check_workflows110.py --out artifacts/workflow-acceptance
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed distribution outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/authzledger-verify"
          "$RUNNER_TEMP/authzledger-verify/bin/python" -m pip install --no-index --no-deps dist/authzledger-*-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" demo --out installed-demo
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" verify installed-demo/fixed/report.json
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" graph installed-demo/contract.json --report installed-demo/fixed/report.json --out installed-graph.json
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" keygen --private operator.pem --public trusted.pem
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" bundle installed-demo/fixed/report.json --key operator.pem --contract installed-demo/contract.json --graph installed-graph.json --out installed-proof
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" verify-bundle installed-proof --public-key trusted.pem
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" compare-retest "$GITHUB_WORKSPACE/artifacts/comparison-acceptance/source.json" "$GITHUB_WORKSPACE/artifacts/comparison-acceptance/baseline.json" "$GITHUB_WORKSPACE/artifacts/comparison-acceptance/current.json" --case peer-denied-owner --out installed-comparison
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" verify-comparison installed-comparison/comparison.json
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" bundle "$GITHUB_WORKSPACE/artifacts/comparison-acceptance/current.json" --key operator.pem --comparison installed-comparison/comparison.json --out installed-comparison-proof
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" verify-bundle installed-comparison-proof --public-key trusted.pem
          "$RUNNER_TEMP/authzledger-verify/bin/python" -m pip install 'reportlab==4.4.9'
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" assessment demo --out installed-assessment
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" assessment verify installed-assessment/03-selective-retest-proof/snapshot.json
          "$RUNNER_TEMP/authzledger-verify/bin/authzledger" verify-bundle installed-assessment/proof --public-key installed-assessment/trusted-public.pem

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned browser test runtime
        run: |
          python -m pip install '.[reports]' 'pypdf==6.10.0'
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps --only-shell chromium
      - name: Existing Studio workflows and source-bound selective retest
        run: |
          node tests/browser_acceptance.cjs
          node tests/browser_v1.cjs
          node tests/browser_comparison.cjs
          node tests/browser_assessments.cjs
          node tests/browser_assessment_security.cjs
          node tests/browser_retest_freshness.cjs

  publish:
    needs: [verify, browser]
    if: github.repository == '0xFarag/0xFarag' && github.event_name == 'push' && github.ref == 'refs/heads/authzledger-v1.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: authzledger-v1.0.0-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build verified release assets
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python tools/package_release.py
      - name: Publish AuthzLedger 1.0 once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: 0xFarag/0xFarag
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GH_REPO" --json tagName >/dev/null 2>&1; then
            echo 'Release exists; tag and assets will not be overwritten.'
            exit 0
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create v1.0.0 dist/authzledger-1.0.0-source.zip dist/authzledger-1.0.0-py3-none-any.whl dist/verify_bundle.py dist/SHA256SUMS.txt dist/AuthzLedger_1.0_Release_wide.mp4 dist/AuthzLedger_1.0_Release_vertical.mp4 dist/AuthzLedger_1.0_en.srt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'AuthzLedger 1.0 — Authorization Intelligence, built on evidence' \
            --notes-file RELEASE_NOTES.md --latest
          gh release view v1.0.0 --repo "$GH_REPO" --json url,isDraft,isPrerelease,tagName

  publish110:
    needs: [verify, browser]
    if: github.repository == '0xFarag/0xFarag' && github.event_name == 'workflow_dispatch' && inputs.publish_110 && github.ref == 'refs/heads/authzledger-v1.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: authzledger-v1.1.0-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require the complete 1.1.0 release contract
        run: python tools/release_gate110.py
      - name: Package the verified commit
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python tools/package_release.py
      - name: Publish immutable AuthzLedger 1.1.0 once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: 0xFarag/0xFarag
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GH_REPO" --json tagName >/dev/null 2>&1; then
            echo 'Release exists; tag and assets will not be overwritten.'
            exit 0
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create v1.1.0 dist/authzledger-1.1.0-source.zip dist/authzledger-1.1.0-py3-none-any.whl dist/verify_bundle.py dist/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'AuthzLedger 1.1.0 — Controlled findings, reproducible proof' \
            --notes-file docs/release-1.1.0.md --latest
