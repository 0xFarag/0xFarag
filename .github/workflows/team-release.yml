name: AuthzLedger Team packages

on:
  push:
    branches: [authzledger-website]
    tags: [team-1.5.0.1]
    paths:
      - 'team/**'
      - 'packaging/team/**'
      - 'scripts/build-team-release.py'
      - 'qa/team*'
      - '.github/workflows/team-release.yml'
      - 'LICENSE'
      - 'NOTICE.txt'
      - 'public/assets/authzledger-logo.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == '0xFarag/0xFarag' && (github.ref == 'refs/heads/authzledger-website' || github.ref == 'refs/tags/team-1.5.0.1')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release tag to point at reviewed website history
        run: |
          test "$(cat packaging/team/VERSION)" = '1.5.0.1'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/authzledger-website
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$(git rev-parse "$GITHUB_REF^{}")" = "$(git rev-parse HEAD)"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies and run Team tests
        run: |
          python -m pip install --only-binary=:all: -r team/requirements.txt
          python -m unittest discover -s qa -p 'test_team*.py' -v
          PYTHONPATH=. python packaging/team/launcher.py --self-test

  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create and verify source and Debian packages
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 scripts/build-team-release.py source --output release
          python3 scripts/build-team-release.py deb --output release
          python3 scripts/build-team-release.py source --output "$RUNNER_TEMP/repeat"
          cmp release/authzledger-team-1.5.0.1.tar.gz "$RUNNER_TEMP/repeat/authzledger-team-1.5.0.1.tar.gz"
          sudo apt-get update -qq
          sudo apt-get install -y ./release/*.deb skopeo xvfb xauth
          authzledger-team --help
          authzledger-team-desktop --self-test
          xvfb-run -a authzledger-team-desktop --gui-self-test
      - name: Build and install the native Arch package
        run: |
          mkdir "$RUNNER_TEMP/arch-build"
          cp release/{PKGBUILD,authzledger-team-1.5.0.1.tar.gz} "$RUNNER_TEMP/arch-build/"
          docker run --rm --volume "$RUNNER_TEMP/arch-build:/work" \
            archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239 bash -euc '
              pacman -Syu --noconfirm --needed python python-cryptography tk
              useradd --create-home packagebuilder
              chown -R packagebuilder:packagebuilder /work
              cd /work
              su packagebuilder -c "makepkg --cleanbuild --noconfirm"
              pacman -U --noconfirm ./authzledger-team-1.5.0.1-1-any.pkg.tar.zst
              authzledger-team --help
              authzledger-team-desktop --self-test
            '
          cp "$RUNNER_TEMP/arch-build/"*.pkg.tar.zst release/
      - name: Build and smoke-test the Docker and OCI archives
        run: |
          image=authzledger-team:1.5.0.1
          name=authzledger-team-1.5.0.1-linux-amd64
          ctx="$RUNNER_TEMP/team-context"
          python3 scripts/build-team-release.py context --output "$ctx"
          docker build --platform linux/amd64 -f "$ctx/packaging/team/Dockerfile" -t "$image" "$ctx"
          docker image inspect -f '{{.Config.User}}' "$image" | grep -x 10001:10001
          docker run --rm "$image" --help
          volume="authzledger-team-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          docker run --rm -v "$volume:/data" --entrypoint python "$image" -c "from team.server import bootstrap; import secrets; bootstrap('/data','test-admin',secrets.token_urlsafe(32))"
          docker run --rm -v "$volume:/data" --entrypoint python "$image" -c "from team.server import needs_bootstrap; assert not needs_bootstrap('/data')"
          docker save "$image" | gzip -n > "release/$name.docker.tar.gz"
          skopeo --insecure-policy copy "docker-daemon:$image" "oci-archive:release/$name.oci.tar:team-1.5.0.1"
          docker image rm "$image"
          docker load -i "release/$name.docker.tar.gz"
          docker run --rm -e PYTHONPATH=/opt/authzledger -v "$PWD/packaging/team/launcher.py:/tmp/launcher.py:ro" --entrypoint python "$image" /tmp/launcher.py --self-test
          docker image rm "$image"
          skopeo --insecure-policy copy "oci-archive:release/$name.oci.tar" "docker-daemon:$image"
          docker run --rm -e PYTHONPATH=/opt/authzledger -v "$PWD/packaging/team/launcher.py:/tmp/launcher.py:ro" --entrypoint python "$image" /tmp/launcher.py --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-linux
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Bundle the native GUI and run its packaged self-test
        run: |
          python -m pip install --only-binary=:all: -r team/requirements.txt -r packaging/team/windows-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build-team-release.py windows --output release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-windows
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.ref == 'refs/tags/team-1.5.0.1'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: team-*
          merge-multiple: true
          path: release
      - name: Verify the complete inventory and create the dedicated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build-team-release.py verify --output release
          (cd release && sha256sum --check --strict SHA256SUMS)
          tag=team-1.5.0.1
          title='AuthzLedger Team 1.5.0.1'
          commit="$(git rev-parse HEAD)"
          marker="Build commit: $commit"
          if gh release view "$tag" --json body,isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            jq -e --arg marker "$marker" '.body | contains($marker)' "$RUNNER_TEMP/release-state.json"
            if jq -e '.isDraft == false' "$RUNNER_TEMP/release-state.json"; then
              gh release view "$tag" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/published"
              find release -type f -printf '%f\n' | sort | diff - "$RUNNER_TEMP/published"
              exit 0
            fi
          else
            { cat packaging/team/README.md; echo; echo "$marker"; } > "$RUNNER_TEMP/release.md"
            gh release create "$tag" --draft --verify-tag --target "$commit" --title "$title" --notes-file "$RUNNER_TEMP/release.md"
          fi
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --latest=false
