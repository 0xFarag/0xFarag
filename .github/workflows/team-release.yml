# © Nasser Aldin Farag (0xFarag). All rights reserved.
name: AuthzLedger Team packages

on:
  push:
    branches: [authzledger-website]
    tags: [team-1.5.0.5]
    paths:
      - 'team/**'
      - 'packaging/team/**'
      - 'integrations/burp/**'
      - 'docs/Team-Login-RBAC.md'
      - 'docs/Key-Rotation.md'
      - 'docs/ZAP-API-Scan-Import.md'
      - 'scripts/build-team-release.py'
      - 'qa/team*'
      - 'qa/test_team*.py'
      - '.github/team-release-request.json'
      - '.github/workflows/team-release.yml'
      - 'LICENSE'
      - 'NOTICE.txt'
      - 'public/assets/authzledger-logo.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == '0xFarag/0xFarag' && (github.ref == 'refs/heads/authzledger-website' || github.ref == 'refs/tags/team-1.5.0.5')
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
      release_sha: ${{ steps.intent.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind publication to a reviewed tag or one explicit source commit
        id: intent
        shell: bash
        run: |
          test "$(cat packaging/team/VERSION)" = '1.5.0.5'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/authzledger-website
          release_sha="$(git rev-parse HEAD)"
          publish=false
          request=.github/team-release-request.json
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$(git rev-parse "$GITHUB_REF^{}")" = "$release_sha"
            publish=true
          elif [[ -f "$request" ]] && [[ "$(git diff --name-only HEAD^ HEAD)" == "$request" ]]; then
            jq -e 'type == "object" and (keys == ["source_commit","tag"]) and .tag == "team-1.5.0.5" and (.source_commit | type == "string" and test("^[a-f0-9]{40}$"))' "$request" >/dev/null
            requested_sha="$(jq -er .source_commit "$request")"
            test "$requested_sha" = "$(git rev-parse HEAD^)"
            release_sha="$requested_sha"
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies and run Team tests
        run: |
          python -m pip install --only-binary=:all: -r team/requirements.txt
          python -m unittest discover -s qa -p 'test_team*.py' -v
          PYTHONPATH=. python packaging/team/launcher.py --self-test
      - name: Exercise the Team workspace in Chromium
        run: |
          npm install --prefix qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node qa/node_modules/playwright/cli.js install chromium
          node --test qa/team-ui.cjs

  burp-export:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test the export and its Team import, then package the extension
        shell: bash
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:?Hosted runner JDK 21 required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          javac -version | grep -E '^javac 21([.]|$)'
          python -m pip install --only-binary=:all: -r team/requirements.txt
          stable=03aea857e35358ddeb13d2a861b633e60c1ca873
          git fetch --no-tags --depth=1 origin "$stable"
          test "$(git rev-parse FETCH_HEAD)" = "$stable"
          git show "$stable:authzledger/imports.py" > "$RUNNER_TEMP/stable_imports.py"
          python integrations/burp/build.py --stable-importer "$RUNNER_TEMP/stable_imports.py"
          jar=integrations/burp/build/authzledger-burp-export.jar
          unzip -tq "$jar"
          unzip -p "$jar" META-INF/NOTICE.txt | grep -Fx '© Nasser Aldin Farag (0xFarag). All rights reserved.'
          mkdir release
          cp "$jar" "release/AuthzLedger-Burp-Export-$(cat packaging/team/VERSION).jar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-burp-export
          path: release/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.release_sha }}
          persist-credentials: false
      - name: Create and verify source and Debian packages
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 scripts/build-team-release.py source --output release
          python3 scripts/build-team-release.py deb --output release
          python3 scripts/build-team-release.py source --output "$RUNNER_TEMP/repeat"
          python3 scripts/build-team-release.py deb --output "$RUNNER_TEMP/repeat"
          cmp release/authzledger-team-1.5.0.5.tar.gz "$RUNNER_TEMP/repeat/authzledger-team-1.5.0.5.tar.gz"
          cmp release/authzledger-team_1.5.0.5-1_all.deb "$RUNNER_TEMP/repeat/authzledger-team_1.5.0.5-1_all.deb"
          sudo apt-get update -qq
          sudo apt-get install -y ./release/*.deb skopeo xvfb xauth
          authzledger-team --help
          authzledger-team-desktop --self-test
          xvfb-run -a authzledger-team-desktop --gui-self-test
          grep -Fx '© Nasser Aldin Farag (0xFarag). All rights reserved.' /usr/share/doc/authzledger-team/copyright
          for guide in Team-Login-RBAC Key-Rotation ZAP-API-Scan-Import Burp-Export; do test -s "/usr/share/doc/authzledger-team/$guide.md"; done
      - name: Build and install the native Arch package
        run: |
          mkdir "$RUNNER_TEMP/arch-build"
          cp release/{PKGBUILD,authzledger-team-1.5.0.5.tar.gz} "$RUNNER_TEMP/arch-build/"
          docker run --rm --volume "$RUNNER_TEMP/arch-build:/work" \
            archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239 bash -euc '
              pacman -Syu --noconfirm --needed python python-cryptography python-reportlab tk
              useradd --create-home packagebuilder
              chown -R packagebuilder:packagebuilder /work
              cd /work
              su packagebuilder -c "makepkg --cleanbuild --noconfirm"
              pacman -U --noconfirm ./authzledger-team-1.5.0.5-1-any.pkg.tar.zst
              authzledger-team --help
              authzledger-team-desktop --self-test
            '
          cp "$RUNNER_TEMP/arch-build/"*.pkg.tar.zst release/
      - name: Build and smoke-test the Docker and OCI archives
        run: |
          image=authzledger-team:1.5.0.5
          name=authzledger-team-1.5.0.5-linux-amd64
          ctx="$RUNNER_TEMP/team-context"
          python3 scripts/build-team-release.py context --output "$ctx"
          docker build --platform linux/amd64 -f "$ctx/packaging/team/Dockerfile" -t "$image" "$ctx"
          docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$image" | grep -Fx 'LicenseRef-AuthzLedger'
          docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image" | grep -Fx '1.5.0.5'
          docker image inspect -f '{{index .Config.Labels "org.authzledger.copyright"}}' "$image" | grep -Fx '© Nasser Aldin Farag (0xFarag). All rights reserved.'
          docker run --rm --entrypoint sh "$image" -ec 'test -s /usr/share/doc/authzledger-team/third-party/INVENTORY.json && test -s /usr/share/doc/authzledger-team/README.md'
          docker image inspect -f '{{.Config.User}}' "$image" | grep -x 10001:10001
          docker run --rm "$image" --help
          volume="authzledger-team-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          docker run --rm -v "$volume:/data" --entrypoint python "$image" -c "from team.server import bootstrap; import secrets; bootstrap('/data','test-admin',secrets.token_urlsafe(32))"
          docker run --rm -v "$volume:/data" --entrypoint python "$image" -c "from team.server import needs_bootstrap; assert not needs_bootstrap('/data')"
          docker save "$image" | gzip -n > "release/$name.docker.tar.gz"
          skopeo --insecure-policy copy "docker-daemon:$image" "oci-archive:release/$name.oci.tar:team-1.5.0.5"
          docker image rm "$image"
          docker load -i "release/$name.docker.tar.gz"
          docker run --rm -e PYTHONPATH=/opt/authzledger -v "$PWD/packaging/team/launcher.py:/tmp/launcher.py:ro" --entrypoint python "$image" /tmp/launcher.py --self-test
          docker image rm "$image"
          skopeo --insecure-policy copy "oci-archive:release/$name.oci.tar" "docker-daemon:$image"
          docker run --rm -e PYTHONPATH=/opt/authzledger -v "$PWD/packaging/team/launcher.py:/tmp/launcher.py:ro" --entrypoint python "$image" /tmp/launcher.py --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-linux
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Bundle the native GUI and run its packaged self-test
        run: |
          python -m pip install --only-binary=:all: -r team/requirements.txt -r packaging/team/windows-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest qa.test_team_rotation qa.test_team_rotation_routes -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          $env:PYTHONHASHSEED = '0'
          python scripts/build-team-release.py windows --output release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Item release/AuthzLedger-Team-1.5.0.5-Windows-x64.exe
          if ($exe.VersionInfo.LegalCopyright -cne '© Nasser Aldin Farag (0xFarag). All rights reserved.' -or $exe.VersionInfo.ProductVersion -ne '1.5.0.5') { throw 'Unexpected Windows product metadata.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-windows
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  site-check:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Wait for the matching website verification run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.source.outputs.release_sha }}
        shell: bash
        run: |
          for attempt in {1..90}; do
            state=
            for revision in "$RELEASE_SHA" "$GITHUB_SHA"; do
              response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/site-browser.yml/runs?head_sha=$revision&branch=authzledger-website&event=push&per_page=10")"
              state="$(jq -r '(.workflow_runs | sort_by(.run_number, .run_attempt) | last) as $r | if $r == null then "" elif $r.status == "completed" then $r.conclusion else "pending" end' <<<"$response")"
              if [[ -n "$state" ]]; then break; fi
            done
            case "$state" in
              success) exit 0 ;;
              ''|pending) sleep 20 ;;
              *) echo "Website CI failed for $revision: $state" >&2; exit 1 ;;
            esac
          done
          echo 'Timed out waiting for matching website CI.' >&2
          exit 1

  publish:
    if: needs.source.outputs.publish == 'true'
    needs: [source, burp-export, linux, windows, site-check]
    concurrency:
      group: publish-authzledger-team-1.5.0.5
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: team-*
          merge-multiple: true
          path: release
      - name: Verify the complete inventory and create the dedicated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.source.outputs.release_sha }}
        shell: bash
        run: |
          python3 scripts/build-team-release.py verify --output release
          (cd release && sha256sum --check --strict SHA256SUMS)
          tag=team-1.5.0.5
          title='AuthzLedger Team 1.5.0.5'
          commit="$RELEASE_SHA"
          marker="Build commit: $commit"
          manifest_sha="$(sha256sum release/SHA256SUMS | cut -d' ' -f1)"
          manifest_marker="SHA256SUMS: $manifest_sha"
          test "$commit" = "$(git rev-parse HEAD)"

          # Create an immutable lightweight tag only if it does not exist.
          # If the tag is already present, resolve its commit and require an exact match.
          ref_path="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ! gh api "$ref_path" > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$commit" >/dev/null
            gh api "$ref_path" > "$RUNNER_TEMP/tag.json"
          fi
          ref_type="$(jq -er .object.type "$RUNNER_TEMP/tag.json")"
          ref_sha="$(jq -er .object.sha "$RUNNER_TEMP/tag.json")"
          if [[ "$ref_type" == tag ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" > "$RUNNER_TEMP/annotated.json"
            ref_type="$(jq -er .object.type "$RUNNER_TEMP/annotated.json")"
            ref_sha="$(jq -er .object.sha "$RUNNER_TEMP/annotated.json")"
          fi
          test "$ref_type" = commit && test "$ref_sha" = "$commit"

          if gh release view "$tag" --json body,isDraft,assets > "$RUNNER_TEMP/prior.json" 2>/dev/null; then
            jq -er .body "$RUNNER_TEMP/prior.json" > "$RUNNER_TEMP/notes"
            grep -Fqx "$marker" "$RUNNER_TEMP/notes"
            mkdir "$RUNNER_TEMP/prior"
            if jq -e '.assets | length > 0' "$RUNNER_TEMP/prior.json" >/dev/null; then
              gh release download "$tag" --dir "$RUNNER_TEMP/prior"
            fi
            if jq -e '.isDraft == false' "$RUNNER_TEMP/prior.json" >/dev/null; then
              (cd release && find . -maxdepth 1 -type f -printf '%f\n' | sort) > "$RUNNER_TEMP/expected"
              (cd "$RUNNER_TEMP/prior" && find . -maxdepth 1 -type f -printf '%f\n' | sort) | diff - "$RUNNER_TEMP/expected"
              prior_sha="$(sha256sum "$RUNNER_TEMP/prior/SHA256SUMS" | cut -d' ' -f1)"
              grep -Fqx "SHA256SUMS: $prior_sha" "$RUNNER_TEMP/notes"
              # Recompute the manifest from the actual published files before accepting a retry.
              cp "$RUNNER_TEMP/prior/SHA256SUMS" "$RUNNER_TEMP/published-checksums"
              python3 scripts/build-team-release.py verify --output "$RUNNER_TEMP/prior"
              cmp "$RUNNER_TEMP/prior/SHA256SUMS" "$RUNNER_TEMP/published-checksums"
              exit 0
            fi
            grep -Fqx "$manifest_marker" "$RUNNER_TEMP/notes"
            for prior in "$RUNNER_TEMP"/prior/*; do
              [[ -e "$prior" ]] || continue
              name="$(basename "$prior")"
              test -f "release/$name"
              cmp "$prior" "release/$name"
            done
          else
            { cat packaging/team/README.md; echo; echo "$marker"; echo "$manifest_marker"; } > "$RUNNER_TEMP/notes"
            gh release create "$tag" --draft --verify-tag --target "$commit" --title "$title" --notes-file "$RUNNER_TEMP/notes"
            mkdir "$RUNNER_TEMP/prior"
          fi
          for asset in release/*; do
            if [[ ! -f "$RUNNER_TEMP/prior/$(basename "$asset")" ]]; then
              gh release upload "$tag" "$asset"
            fi
          done
          mkdir "$RUNNER_TEMP/upload-check"
          gh release download "$tag" --dir "$RUNNER_TEMP/upload-check"
          cmp release/SHA256SUMS "$RUNNER_TEMP/upload-check/SHA256SUMS"
          (cd "$RUNNER_TEMP/upload-check" && sha256sum --check --strict SHA256SUMS)
          python3 scripts/build-team-release.py verify --output "$RUNNER_TEMP/upload-check"
          cmp release/SHA256SUMS "$RUNNER_TEMP/upload-check/SHA256SUMS"
          gh release edit "$tag" --draft=false --latest=false
