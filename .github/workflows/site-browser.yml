name: Verify AuthzLedger public website
on:
  push:
    branches: [launch/evidence-site-20261121, launch/evidence-import-20261123, launch/storefront-20261123, launch/evidence-workbench-20261123, launch/multitool-import-20261123, authzledger-website]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Site browser / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned website runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize checksum-pinned download files
        run: node scripts/build-downloads.mjs
      - name: Check the complete offline download inventory
        run: node scripts/build-downloads.mjs --check
      - name: Rebuild the standalone download and test the extracted CLIs
        run: python qa/test_offline_download.py
      - name: Install pinned browser test runner
        run: npm install --prefix qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 sax@1.6.1
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: node qa/node_modules/playwright/cli.js install chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: node qa/node_modules/playwright/cli.js install chromium
      - name: Verify passkey registration, private sessions and logout
        run: node --test qa/passkeys.test.cjs qa/account-store.test.cjs qa/account-browser.cjs
      - name: Check source-bound observation comparisons
        run: node --test qa/import-formats.cjs qa/portal-alert.test.cjs qa/portal-controls.test.cjs qa/portal-directory.test.cjs qa/portal-graph.test.cjs qa/portal-reference.test.cjs qa/format-extensions.cjs qa/asset-review.cjs qa/ferox-format.cjs qa/import-compare.cjs qa/import-compare-browser.cjs
      - name: Check evidence workbench projections and comparisons
        run: node --test qa/board-blue.test.mjs qa/board-compare.test.mjs qa/board-model.test.mjs qa/board-index.test.mjs qa/board-exports.test.mjs qa/proof-cockpit.test.mjs
      - name: Verify native policy permissions, retests, file triage and vetted access
        run: node --test qa/rbac-policy.test.mjs qa/rbac-retest.test.mjs qa/rbac-browser.cjs qa/rbac-matrix.test.mjs qa/rbac-matrix-browser.cjs qa/file-triage.test.mjs qa/file-triage-browser.cjs qa/pro-review.cjs qa/pro-access-browser.cjs
      - name: Verify billing readiness, checkout and customer journeys
        run: node --test qa/billing-api.cjs qa/customer.cjs qa/customer-browser.cjs
      - name: Build standalone language routes
        run: node scripts/build-locales.mjs
      - name: Verify language switching, direction and retained state
        run: node qa/languages.cjs
      - name: Test public pages and their evidence
        run: node qa/website.cjs

  hostinger:
    name: Package public website for Hostinger
    needs: browser
    if: github.ref == 'refs/heads/authzledger-website'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble the public downloads
        run: node scripts/build-downloads.mjs
      - name: Build all language editions
        run: node scripts/build-locales.mjs
      - name: Check the Hostinger document root
        run: test -s dist/index.html && test -s dist/fr/workbench/index.html
      - name: Upload static site with index.html at the archive root
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AuthzLedger-Hostinger-${{ github.sha }}
          path: dist/
          if-no-files-found: error
