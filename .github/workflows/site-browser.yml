name: Verify AuthzLedger public website
on:
  push:
    branches: [launch/evidence-site-20261121, authzledger-website]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Site browser / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned browser test runner
        run: npm install --prefix qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: node qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: node qa/node_modules/playwright/cli.js install chromium
      - name: Test public pages and their evidence
        run: node qa/website.cjs
