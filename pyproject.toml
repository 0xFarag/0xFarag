[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authzledger"
version = "0.3.4"
description = "Versioned API authorization contracts, control-aware retests and redacted evidence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LicenseRef-Proprietary"}
authors = [{name = "Nasser Aldin Farag"}]
keywords = ["authorization", "appsec", "pentest", "api-security", "regression-testing"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Security", "Topic :: Software Development :: Testing"]
dependencies = []

[project.scripts]
authzledger = "authzledger.cli:main"

[project.urls]
Homepage = "https://github.com/0xFarag/0xFarag/tree/authzledger-v0.3.4"
Repository = "https://github.com/0xFarag/0xFarag/tree/authzledger-v0.3.4"
Issues = "https://github.com/0xFarag/0xFarag/issues"

[tool.setuptools]
packages = ["authzledger"]

[tool.setuptools.package-data]
authzledger = ["brand_logo.png", "web/*.html", "web/*.css", "web/*.js", "web/*.json"]
